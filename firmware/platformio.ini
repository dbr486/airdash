[platformio]
default_envs = ttgo

; LILYGO TTGO T-Display V1.1: ESP32, ST7789 135x240. TFT_eSPI is configured
; entirely from build flags (the values of its Setup25_TTGO_T_Display.h) so
; the library sources stay untouched.
[env:ttgo]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    -DAIRDASH_BOARD_TTGO=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000

; M5Stack StickS3: ESP32-S3, ST7789P3 135x240 behind the M5PM1 power chip,
; native USB. M5Unified powers the LCD rail and owns the buttons, so the
; panel is driven through M5GFX rather than TFT_eSPI.
[env:sticks3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps =
    m5stack/M5Unified@^0.2.12
    m5stack/M5GFX@^0.2.18
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    -DAIRDASH_BOARD_STICKS3=1
    ; M5GFX probes this board's panel first instead of auto-detecting from
    ; scratch; M5Unified's fallback_board only applies after the display
    ; probe has already given up.
    -DM5GFX_BOARD=board_t::board_M5StickS3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Host-side unit tests for the pure units (no Arduino headers).
[env:native]
platform = native
lib_deps = bblanchon/ArduinoJson@^6.21.5
test_build_src = yes
build_src_filter = +<parse.cpp> +<format.cpp>
build_flags = -std=c++17 -Isrc
